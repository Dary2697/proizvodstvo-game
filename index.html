<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моё производство</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efff;--card:#fff;--tx:#1b1530;--mut:#6b6385;--pu:#a66cff;--or:#ff9900;--li:#e7ff6a;--bl:#e1f4ff;--pk:#fae3ff;--bd:#d9c6ff;--bad:#e5484d;--ok:#2f9e5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17102b;--card:#241a42;--tx:#f4eeff;--mut:#b5a8d6;--bl:#1d2a45;--pk:#33214f;--bd:#4a3a78}}
:root[data-theme=dark]{--bg:#17102b;--card:#241a42;--tx:#f4eeff;--mut:#b5a8d6;--bl:#1d2a45;--pk:#33214f;--bd:#4a3a78}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 Rubik,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
h1,h2,h3{margin:0;font-weight:900;line-height:1.1}
h1{font-size:clamp(34px,7vw,58px)}h2{font-size:clamp(24px,4vw,34px);margin-bottom:10px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--pu);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:16px;font-weight:700}
.top .sp{flex:1}.chip{background:#fff;color:#1b1530;border-radius:99px;padding:3px 12px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;background:var(--or);color:#1b1530}
button:hover{filter:brightness(1.06)}button:focus-visible,input:focus-visible{outline:3px solid var(--pu);outline-offset:2px}
button.sec{background:var(--li)}button.big{font-size:20px;padding:14px 26px}
.biz{text-align:left;background:var(--bl);color:var(--tx);border:3px solid transparent;font-weight:500}
.biz b{display:block;font-size:19px}.biz.on{border-color:var(--pu);background:var(--pk)}
.biz .e{font-size:34px}
input[type=text]{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
.fac{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--bl);border-radius:14px;padding:12px;margin-bottom:10px}
.fac .e{font-size:34px}.fac small{color:var(--mut);display:block}
.lv{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px}
.lv button{padding:4px 14px;font-size:22px}.dots{letter-spacing:3px;color:var(--pu)}
.stage{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;border-left:8px solid var(--pu);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;animation:in .5s both}
.stage:nth-child(2){animation-delay:.6s;border-color:var(--or)}.stage:nth-child(3){animation-delay:1.2s;border-color:#9bc400}.stage:nth-child(4){animation-delay:1.8s;border-color:#4aa8ff}
@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.stage .e{font-size:30px}.stage b{font-size:19px}
table{width:100%;border-collapse:collapse;margin-top:6px}td{padding:4px 8px;border-bottom:1px solid var(--bd)}td:last-child{text-align:right;font-weight:700}
.ev{background:var(--li);color:#1b1530;border-radius:14px;padding:14px;font-weight:500}
.ev.bad{background:#ffd9d9}.ev.good{background:#d7f7e1}
.q{background:var(--pk);border-radius:14px;padding:14px}.ans{display:none;margin-top:10px;background:var(--card);border:2px dashed var(--pu);border-radius:12px;padding:10px 14px;font-weight:700}
.ans.show{display:block}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.bar{height:14px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--or)}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--mut)}
@media (prefers-reduced-motion:reduce){.stage{animation:none}}
</style></head><body><main id="app"></main>
<script>
var BIZ=[
{e:'🥖',n:'Пекарня «Тёплый хлеб»',t:'товар',p:'свежий хлеб и булочки'},
{e:'🧸',n:'Фабрика игрушек «Мягкий друг»',t:'товар',p:'плюшевые игрушки'},
{e:'🐄',n:'Ферма «Зелёный луг»',t:'товар',p:'молоко и сыр'},
{e:'📚',n:'Издательство «Новая страница»',t:'товар',p:'книги для школьников'},
{e:'☕',n:'Кофейня «Кот и чашка»',t:'услуга',p:'кофе и уютное место'},
{e:'📱',n:'Мастерская «Чинимс»',t:'услуга',p:'ремонт телефонов'},
{e:'🎮',n:'Студия «Пиксель»',t:'услуга',p:'мобильные игры'}];
var EM=['🥖','🧸','🦘','☕','📱','🎮','🍕','👟','🎨','🚲','🐾','💇'];
var INC=['заработная плата','рента','процент','прибыль','роялти'];
var F=[
{k:'l',n:'Труд',e:'👷',inc:'заработная плата',ok:[0],d:'Умственные и физические способности людей, которые используют в форме услуг, необходимых для производства экономических благ.',q:'Кто будет работать в вашем производстве? Какие умения нужны?',ph:'Например: 2 пекаря и продавец'},
{k:'z',n:'Земля',e:'🌲',inc:'рента',ok:[1],d:'Совокупность природных ресурсов, которые используются для производства экономических благ.',q:'Какие природные ресурсы и какой участок нужны вашему делу?',ph:'Например: мука, вода, участок под цех'},
{k:'c',n:'Капитал',e:'🏭',inc:'процент',ok:[2],d:'Совокупность созданных человеком ресурсов производства: оборудование, инструменты, производственные здания и т. д.',q:'Какие станки, инструменты и здания вам понадобятся?',ph:'Например: печь, миксер, витрина'},
{k:'p',n:'Предпринимательские способности',e:'🧠',inc:'прибыль',ok:[3],d:'Совокупность навыков и знаний, позволяющих оптимально использовать факторы производства и получать максимальный доход.',q:'Что должен уметь директор, чтобы соединить труд, землю и капитал?',ph:'Например: составлять меню, договариваться с поставщиками'},
{k:'i',n:'Информация',e:'💡',inc:'прибыль или роялти',ok:[3,4],d:'Все знания (сведения), которые необходимы людям для успешной экономической деятельности.',q:'Какие знания и сведения нужны вашему производству?',ph:'Например: секретный рецепт, данные о вкусах покупателей'}];
var S,A=document.getElementById('app'),$=function(h){A.innerHTML=h;window.scrollTo(0,0)};
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hdr(){var n=S.step==null?'':'<span class="chip">'+(S.step<5?'Фактор '+(S.step+1)+' из 5':S.step==5?'Весь цикл':'Паспорт')+'</span>';return '<div class="top"><span>🐱 Моё производство</span><span class="sp"></span>'+(S.biz?'<span class="chip">'+S.biz.e+' '+esc(S.name)+'</span>':'')+n+'<span class="chip">⭐ '+S.stars+'</span></div>'}
function start(){S={step:null,d:{},inc:{},tr:{},stars:0,e:'🥖',t:'товар'};
$('<div class="card" style="background:var(--pu);color:#fff;border-color:var(--pu)"><h1>Моё производство</h1><p style="font-size:20px;margin:10px 0 0">Ты директор. Придумай своё дело. Мы вместе разберём каждый фактор производства, а ты сразу впишешь его в свой бизнес. В конце получишь паспорт предприятия.</p></div><div class="card"><h2>Придумай производство</h2><p><b>Твоё имя</b></p><input type="text" id="dn" maxlength="30" placeholder="Имя и фамилия директора"><p><b>Название предприятия</b></p><input type="text" id="nm" maxlength="40" placeholder="Например, «Лисья пекарня»"><p><b>Что ты производишь или какую услугу оказываешь?</b></p><input type="text" id="pd" maxlength="50" placeholder="Например, веганские пирожные"><p><b>Это товар или услуга?</b></p><div class="row" style="margin-top:0"><button class="sec" id="tt" onclick="ty(\'товар\')">Товар</button><button class="sec" id="tu" onclick="ty(\'услуга\')">Услуга</button></div><p><b>Значок</b></p><div class="row" style="margin-top:0">'+EM.map(function(e){return '<button class="biz" style="padding:6px 12px;font-size:26px" onclick="em(this,\''+e+'\')">'+e+'</button>'}).join('')+'</div><p class="mut" style="margin-top:14px">Нет идей? Нажми, чтобы подставить пример:</p><div class="row" style="margin-top:0">'+BIZ.map(function(b,i){return '<button class="sec" onclick="idea('+i+')">'+b.e+' '+b.p+'</button>'}).join('')+'</div></div><button class="big" onclick="go()">Открыть предприятие</button><p class="mut" style="margin-top:18px">Автор игры: Дарья Мезенцева | обществознание &amp; история ЕГЭ ОГЭ. Канал: <a href="https://t.me/neckazki" target="_blank" rel="noopener" style="color:var(--pu);font-weight:700">t.me/neckazki</a></p>');ty('товар')}
function ty(t){S.t=t;document.getElementById('tt').style.outline=t=='товар'?'3px solid var(--pu)':'0';document.getElementById('tu').style.outline=t=='услуга'?'3px solid var(--pu)':'0'}
function em(b,e){S.e=e;document.querySelectorAll('.biz').forEach(function(x){x.classList.remove('on')});b.classList.add('on')}
function idea(i){var b=BIZ[i];document.getElementById('nm').value=b.n;document.getElementById('pd').value=b.p;ty(b.t);S.e=b.e}
function go(){var n=document.getElementById('nm').value.trim(),p=document.getElementById('pd').value.trim();
if(!n||!p){alert('Впиши название предприятия и то, что ты производишь');return}
S.name=n;S.dir=document.getElementById('dn').value.trim()||'директор';S.biz={e:S.e,t:S.t,p:p};fs(0)}
function fs(i){S.step=i;var f=F[i];
$(hdr()+'<div class="row" style="margin:0 0 12px">'+F.map(function(x,j){return '<span class="chip" style="background:'+(j<i?'var(--li)':j==i?'var(--or)':'var(--card)')+'">'+x.e+'</span>'}).join('')+'</div>'+
'<div class="card"><div style="font-size:54px">'+f.e+'</div><h2>Фактор: '+f.n+'</h2><div class="ev">'+f.d+'</div></div>'+
'<div class="card q"><h3>Обсуждаем с классом</h3><p style="font-size:20px">'+f.q+'</p></div>'+
'<div class="card"><h3>Впиши в своё производство</h3><p>'+S.biz.e+' <b>'+esc(S.name)+'</b>: '+f.n.toLowerCase()+'</p><input type="text" id="fi" maxlength="80" placeholder="'+f.ph+'" value="'+esc(S.d[f.k]||'')+'">'+
'<h3 style="margin-top:18px">Как называется доход владельца этого фактора?</h3><div class="row">'+INC.map(function(x,j){return '<button class="sec" id="ib'+j+'" onclick="pk('+i+','+j+')">'+x+'</button>'}).join('')+'</div><p id="fb" style="font-weight:700;margin:10px 0 0">'+(S.inc[f.k]?'✅ Верно: '+f.inc:'')+'</p></div>'+
'<div class="row">'+(i?'<button class="sec" onclick="bk('+i+')">Назад</button>':'')+'<button class="big" onclick="nx2('+i+')">'+(i<4?'Следующий фактор':'Запустить цикл')+'</button></div>')}
function pk(i,j){var f=F[i],fb=document.getElementById('fb');
if(f.ok.indexOf(j)>-1){var first=!S.tr[f.k];S.inc[f.k]=1;if(first)S.stars++;S.tr[f.k]=1;fb.textContent='✅ Верно: '+f.inc+(first?' ⭐':'')}
else{S.tr[f.k]=1;fb.textContent='❌ Не совсем. Подумай ещё раз и выбери другой вариант.'}}
function sv(i){S.d[F[i].k]=document.getElementById('fi').value.trim()}
function bk(i){sv(i);fs(i-1)}
function nx2(i){sv(i);if(!S.d[F[i].k]){alert('Впиши, что это в твоём производстве');return}
if(!S.inc[F[i].k]){alert('Выбери верный доход владельца фактора');return}
if(i<4)fs(i+1);else cyc()}
function cyc(){S.step=5;var P=esc(S.biz.p);
$(hdr()+'<div class="card"><h2>Запускаем весь цикл</h2><p>Факторы собраны. Теперь посмотрим, как твоё дело проходит четыре стадии экономической деятельности.</p></div><div style="margin-top:12px">'+
'<div class="stage"><span class="e">🏭</span><div><b>Производство</b><br>Из факторов создаётся: '+P+' ('+S.biz.t+').<br>'+F.map(function(f){return f.e+' '+f.n+': '+esc(S.d[f.k])}).join('<br>')+'</div></div>'+
'<div class="stage"><span class="e">✂️</span><div><b>Распределение</b><br>Доход делится между владельцами факторов:<br>'+F.map(function(f){return esc(S.d[f.k])+' → '+f.inc}).join('<br>')+'</div></div>'+
'<div class="stage"><span class="e">🤝</span><div><b>Обмен</b><br>Покупатели отдают деньги, а ты отдаёшь им: '+P+'.</div></div>'+
'<div class="stage"><span class="e">😋</span><div><b>Потребление</b><br>Покупатели используют продукт, и появляется новая потребность. Цикл начинается снова.</div></div></div>'+
'<div class="card q"><h3>Вопрос: напиши ответ в чат</h3><p style="font-size:20px">«Одно время решающим фактором производства была земля, затем капитал. Сегодня решающий фактор: сам человек и его знания» (Иоанн Павел II). Согласен ли ты? Какой фактор самый важный в твоём деле?</p><button class="sec" onclick="document.getElementById(\'an\').classList.toggle(\'show\')">Показать подсказку</button><div class="ans" id="an">Открытый вопрос: приведи аргументы. Человек проявляется в труде, предпринимательских способностях и информации.<div class="row"><button class="sec" onclick="stz(this)">Ответил(а) в чат ⭐</button></div></div></div>'+
'<button class="big" onclick="pasp()">Получить паспорт предприятия</button>')}
function stz(b){S.stars++;b.parentNode.innerHTML='⭐ засчитано'}
function pasp(){S.step=6;
$(hdr()+'<div id="pass" style="border:4px solid var(--pu);border-radius:20px;overflow:hidden;background:var(--card)"><div style="background:var(--pu);color:#fff;padding:18px 20px"><div style="font-size:15px;font-weight:500">Паспорт предприятия</div><h1 style="font-size:clamp(28px,6vw,44px)">'+S.biz.e+' '+esc(S.name)+'</h1><div style="font-size:19px;margin-top:6px">'+S.biz.t+': '+esc(S.biz.p)+'<br>Директор: '+esc(S.dir)+'</div></div><div style="padding:14px 20px"><table>'+F.map(function(f){return '<tr><td><b>'+f.e+' '+f.n+'</b><br>'+esc(S.d[f.k])+'</td><td>'+f.inc+'</td></tr>'}).join('')+'</table><p style="margin:14px 0 0;font-weight:700">Стадии: производство → распределение → обмен → потребление</p><p style="margin:6px 0 0">⭐ за ответы: '+S.stars+' · Обществознание, 8 класс, урок «Производство»</p><p style="margin:8px 0 0;font-size:15px">Дарья Мезенцева | обществознание &amp; история ЕГЭ ОГЭ: <a href="https://t.me/neckazki" target="_blank" rel="noopener" style="color:var(--pu);font-weight:700">t.me/neckazki</a></p></div></div>'+
'<p class="mut">Сделай скриншот паспорта и отправь его на доску.</p><div class="row"><button class="sec" onclick="fs(4)">Изменить факторы</button><button class="sec" onclick="start()">Создать новое предприятие</button><a href="https://t.me/neckazki" target="_blank" rel="noopener" style="display:inline-block;background:var(--pu);color:#fff;font-weight:700;border-radius:12px;padding:10px 18px;text-decoration:none">Подписаться на канал «Дарья Мезенцева | обществознание &amp; история ЕГЭ ОГЭ»</a></div>')}
start();
</script></body></html>
